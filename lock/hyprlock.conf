# UMBRA lock screen for hyprlock — same planet, type and spacing as the greeter.
# Lilac is reserved for focus/feedback (DESIGN.md); a wrong password never flashes red.

$text      = rgba(242, 242, 243, 1.0)
$secondary = rgba(166, 166, 176, 1.0)
$quiet     = rgba(119, 119, 129, 1.0)
$outline   = rgba(52, 52, 61, 1.0)
$lilac     = rgba(167, 139, 250, 1.0)
$sans      = Adwaita Sans
$display   = Noto Sans Light

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = calm, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 8, calm
    animation = fadeOut, 1, 5, calm
    animation = inputFieldColors, 1, 5, calm
    animation = inputFieldFade, 1, 5, calm
    animation = inputFieldWidth, 1, 5, calm
    animation = inputFieldDots, 1, 4, calm
}

background {
    monitor =
    path = ~/.config/hypr/umbra-lock-bg.png
    color = rgba(0, 0, 0, 1.0)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $text
    font_size = 104
    font_family = $display
    position = 140, 80
    halign = left
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:30000] LC_TIME=pt_BR.UTF-8 date "+%A, %-d de %B"
    color = $secondary
    font_size = 17
    font_family = $sans
    position = 144, -24
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 390, 46
    position = 144, -110
    halign = left
    valign = center
    rounding = 8
    outline_thickness = 1
    inner_color = rgba(17, 17, 22, 0.55)
    outer_color = $outline
    check_color = $lilac
    fail_color = $lilac
    font_color = $text
    font_family = $sans
    font_size = 16
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = false
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground="##92929E">Digite sua senha</span>
    fail_text = Senha incorreta
    capslock_color = $lilac
    swap_font_color = false
}

# Hint under the field
label {
    monitor =
    text = Digite a senha para desbloquear
    color = $quiet
    font_size = 13
    font_family = $sans
    position = 144, -172
    halign = left
    valign = center
}

# Footer, left
label {
    monitor =
    text = Tela bloqueada
    color = $quiet
    font_size = 13
    font_family = $sans
    position = 144, 54
    halign = left
    valign = bottom
}
