# Nocturne greeter for greetd. Installed by the nocturne-greeter package and
# selected by greetd.service.d/nocturne-greeter.conf. The launcher checks Qt
# compatibility and offers agreety text login if a rebuild is needed.
[terminal]
vt = 1

[default_session]
command = "/usr/lib/nocturne-greeter/nocturne-greeter-start"
user = "greeter"
