# Keep the last boot splash frame on screen until the greeter's compositor
# takes the display, instead of dropping to the bare text console first.
# Same handoff GDM and SDDM use. nocturne-greeter-start switches the VT back
# to text mode itself when it falls back to the agreety recovery login.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
